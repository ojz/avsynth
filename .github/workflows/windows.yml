name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/drone-commander | Out-Null
          Copy-Item drone_commander.exe dist/drone-commander/
          Copy-Item apps/drone-commander/README.md dist/drone-commander/
          Compress-Archive dist/drone-commander/* dist/drone-commander-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: drone-commander-windows
          path: dist/drone-commander-windows.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/drone-commander-windows.zip