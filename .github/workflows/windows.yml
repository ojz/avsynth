name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # The whole job runs in the same MSYS2 UCRT64 shell a developer uses, so CI
    # resolves the same libraries from the same packages (ROADMAP D1). Drift
    # between the two apps' toolchains becomes a build failure here.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Build
        run: make build BUILD_TYPE=Release

      - name: Test
        run: make test BUILD_TYPE=Release

      - name: Package
        run: make package BUILD_TYPE=Release

      # One artifact per app, under the names downloads already use. They come
      # out of a single job on purpose: both apps share one toolchain install
      # and are built and tested together, so a divergence fails the build
      # instead of passing in one job and failing in the other.
      - uses: actions/upload-artifact@v4
        with:
          name: drone-commander-windows
          path: dist/drone_commander-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vsynth-windows
          path: dist/vsynth-windows.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
